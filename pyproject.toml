[project]
name = "devops-triage"
version = "0.1.0"
description = "DevOps Intelligence environment for OpenEnv — log diagnosis, test triage, and outage RCA"
requires-python = ">=3.10"
dependencies = [
    "openenv-core>=0.2.3",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "fastmcp",
    "pydantic>=2.0",
    "openai",
]

[project.scripts]
server = "server.app:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
