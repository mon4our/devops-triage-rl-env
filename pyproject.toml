[project]
name = "devops-triage"
version = "0.1.0"
description = "DevOps Intelligence environment for OpenEnv — log diagnosis, test triage, and outage RCA"
requires-python = ">=3.10"
dependencies = [
    "openenv-core>=0.2.3",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "fastmcp",
    "pydantic>=2.0",
    "openai",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
server = "server.app:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["server", "server.data"]

[tool.pytest.ini_options]
# `importlib` mode stops pytest from walking up from tests/__init__.py to the
# repo root and treating the project as a package named `openenv` — which
# would shadow the installed `openenv-core` package. The empty __init__.py at
# the repo root is intentional for the hackathon submission layout, so we
# reach around it here instead of deleting it.
addopts = "--import-mode=importlib"
pythonpath = ["."]
testpaths = ["tests"]
